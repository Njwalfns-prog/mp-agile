  font-size: 12px;
  line-height: 20px;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  color: var(--foreground);
  font: inherit;
  text-align: start;
  border-collapse: separate;
  border-spacing: 0;
  font-size: calc(var(--font-size-base) * 0.875);
  line-height: calc(var(--font-size-base) * 1.625);
  font-family: var(--font-sans);
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
  border-bottom-color: color-mix(in srgb, var(--foreground) 5%, transparent);
}
.table :is(th, td):not(:last-child) {
  padding-inline-end: calc(var(--font-size-base) * 1.5);
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead :is(th, td) {
  border-bottom-color: var(--border-strong, var(--input));
  padding-block: calc(var(--font-size-base) / 2);
  line-height: var(--font-size-base);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}
.table tbody :is(th, td) {
  padding-block: calc(var(--font-size-base) * 0.625);
}

.table.table-sm :is(th, td) {
  padding-block: 8px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  border: 1px solid var(--border);
  corner-shape: var(--corner-shape);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
  font-family: var(--font-sans);
  padding: 5px 12px;
  border-color: color-mix(
    in oklab,
    light-dark(var(--primary-foreground), var(--foreground)) 5%,
    transparent
  );
  border-radius: var(--radius-2xl);
  color: light-dark(var(--primary-foreground), var(--foreground));
  background: light-dark(var(--foreground), var(--popover));
  box-shadow: 0 8px 18px rgb(15 23 42 / 20%);
  letter-spacing: -0.15px;
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: 600;
  line-height: 18px;
  text-align: center;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  color: color-mix(in srgb, var(--foreground) 40%, var(--muted-foreground));
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-family: var(--font-sans);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 1;
}

small,
.text-small {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

/* Match inline alignment without overriding a containing flex or grid layout. */
.btn,
.nav-link,
.form-control,
.form-select,
.form-range,
.form-check {
  vertical-align: middle;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  corner-shape: var(--corner-shape);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: inherit;
  font-family: var(--font-sans);
  height: fit-content;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  padding-inline: var(--control-spacing, 12px);
  border-color: transparent;
  border-radius: var(--radius-full);
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 18px;
}

.btn {
  border-color: var(--border);
  color: var(--secondary-foreground);
  background: var(--secondary);
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)
  );
}

.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {
  background: color-mix(in srgb, var(--foreground) 10%, transparent);
}

.btn-primary {
  border-color: var(--border);
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: border-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: border-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--muted-foreground);
  background: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)
  );
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host&#x27;s design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker &gt; summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls &gt; button,
.viz-carousel-picker &gt; summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker &gt; summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls &gt; button &gt; svg,
.viz-carousel-controls .viz-carousel-caret,
.viz-carousel-count {
  opacity: 0.5;
}

.viz-carousel-controls &gt; button::before,
.viz-carousel-picker &gt; summary::before {
  position: absolute;
  z-index: -1;
  inset: 3px;
  border-radius: 12px;
  content: &quot;&quot;;
  pointer-events: none;
}

.viz-carousel-controls &gt; button:hover::before,
.viz-carousel-picker &gt; summary:hover::before {
  background: var(--viz-carousel-hover);
}

.viz-carousel-controls &gt; button,
.viz-carousel-controls [data-lucide],
.viz-carousel-controls .lucide {
  flex-shrink: 0;
}

.viz-carousel-picker {
  min-width: 0;
}

.viz-carousel-picker &gt; summary {
  min-width: 0;
  list-style: none;
}

.viz-carousel-picker &gt; summary::-webkit-details-marker {
  display: none;
}

.viz-carousel-count {
  flex-shrink: 0;
  white-space: nowrap;
}

.viz-carousel-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options &gt; button {
  border-radius: max(0px, calc(var(--radius-lg) - 5px)) !important;
  width: 100% !important;
  min-height: 28px;
  justify-content: flex-start !important;
  padding: 4px 8px !important;
  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options &gt; [aria-current=&quot;true&quot;],
.viz-carousel-options &gt; button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  font-family: var(--font-sans);
  height: calc(12px + 2 * var(--control-spacing, 12px));
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  padding-inline: calc(4px + var(--control-spacing, 12px) / 2);
  border-color: var(--input);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--popover) 96%, transparent);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 1.4285714286;
}
.form-control:is(
  [type=&quot;file&quot;],
  [type=&quot;date&quot;],
  [type=&quot;datetime-local&quot;],
  [type=&quot;month&quot;],
  [type=&quot;week&quot;],
  [type=&quot;color&quot;]
) {
  height: calc(12px + 2 * var(--control-spacing, 12px));
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  line-height: 18px;
}
.form-control:is(
  [type=&quot;date&quot;],
  [type=&quot;datetime-local&quot;],
  [type=&quot;month&quot;],
  [type=&quot;week&quot;]
) {
  padding-inline: var(--control-spacing, 12px);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
  padding: 0;
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
  min-height: calc(10px + 2 * var(--control-spacing, 12px));
  padding-inline: var(--control-spacing, 12px);
  margin-inline-end: var(--control-spacing, 12px);
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: calc(12px + 2 * var(--control-spacing, 12px));
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  resize: vertical;
  min-height: 96px;
  padding: 8px 10px;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: none;
}
.form-control:disabled {
  color: var(--muted-foreground);
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  opacity: 1;
}
.form-control[aria-invalid=&quot;true&quot;] {
  border-color: var(--red);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--red) 20%, transparent);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  height: fit-content;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  margin: 0;
  /* The secondary icon role is 14px at compact density and 16px at web density. */
  --icon-size: calc(10px + var(--control-spacing, 12px) / 2);
  /* Settings dropdowns retain a 12px inset and a 4px text-to-chevron gap. */
  padding: 0 calc(16px + var(--icon-size)) 0 12px;
  outline: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(
      45deg,
      transparent calc(50% - 0.6px),
      var(--muted-foreground) calc(50% - 0.6px) calc(50% + 0.6px),
      transparent calc(50% + 0.6px)
    ),
    linear-gradient(
      135deg,
      transparent calc(50% - 0.6px),
      var(--muted-foreground) calc(50% - 0.6px) calc(50% + 0.6px),
      transparent calc(50% + 0.6px)
    );
  background-position:
    calc(100% - 12px - var(--icon-size) / 2) 50%,
    calc(100% - 12px - var(--icon-size) * 0.18) 50%;
  background-repeat: no-repeat;
  background-size: calc(var(--icon-size) * 0.32) calc(var(--icon-size) * 0.32);
  cursor: var(--cursor-interaction, default);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 18px;
}

.form-select option {
  color: var(--popover-foreground);
  background-color: var(--popover);
}

.form-select:not(:disabled):hover {
  background-color: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)
  );
}

.form-select:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}
.form-select:disabled {
  opacity: 0.4;
}

.form-check {
  display: flex;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  corner-shape: round;
  box-shadow: var(--shadow-sm);
  position: relative;
  width: calc(10px + var(--control-spacing, 12px) / 2);
  height: calc(10px + var(--control-spacing, 12px) / 2);
  border-color: var(--border-strong, var(--input));
  border-radius: calc(var(--radius-sm) / 2);
  background-color: transparent;
  color: var(--foreground);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:is(:checked, :indeterminate) {
  border-color: var(--border-strong, var(--input));

function layoutMetrics(){
  const p=boardPlan();
  return {w:Math.max(p.w,4),h:Math.max(p.h,3)};
}
// Column widths are equal in both layouts (portrait lanes share one width), so the
// board reads as a grid and the camera can frame it against a fixed aspect ratio.
function frameExtent(aspect){
  const p=boardPlan();
  if(p.focus){
    const b=p.bits[activeLane];
    return {w:Math.max(b.laneW*1.15,0.5),h:Math.max(p.phs[activeLane]*1.15,0.5)};
  }
  return {w:p.w*1.15,h:p.h*1.15};
}
function fitCamera(keepZoom){
  if(!camera)return;
  const aspect=camera.aspect||1;
  const vfov=camera.fov*Math.PI/180;
  const e=frameExtent(aspect);
  const safeH=isFinite(e.h)&amp;&amp;e.h&gt;0?e.h:6;
  const safeW=isFinite(e.w)&amp;&amp;e.w&gt;0?e.w:12;
  const distH=(safeH/2)/Math.tan(vfov/2);
  const distW=(safeW/2)/(Math.tan(vfov/2)*aspect);
  baseRadius=Math.max(distH,distW);
  if(!isFinite(baseRadius)||baseRadius&lt;=0)baseRadius=Math.max(safeW,safeH);
  if(!isFinite(baseRadius)||baseRadius&lt;=0)baseRadius=16;
  viewTarget.x=baseTarget.x;
  viewTarget.y=baseTarget.y;
  if(!keepZoom)targets.zoom=1;
  applyCamera();
}
function applyCamera(){
  if(!camera)return;
  const phi=Math.max(0.12,Math.min(Math.PI/2-0.04,current.phi));
  const r=baseRadius*current.zoom;
  camera.position.set(
    viewTarget.x+Math.sin(phi)*Math.sin(current.theta)*r,
    viewTarget.y+Math.cos(phi)*r,
    Math.sin(phi)*Math.cos(current.theta)*r
  );
  camera.lookAt(viewTarget.x,viewTarget.y,0);
}
function resize(){
  if(!renderer||!camera)return;
  const w=Math.max(120,wrap.clientWidth||360);
  const h=Math.max(120,wrap.clientHeight||260);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.fov=w/h&gt;=1.6?42:w/h&gt;=1?50:58;
  camera.updateProjectionMatrix();
  const oldOrient=posterOrientation;
  if(updateScaleForViewport()){
    buildBoard();
    renderLaneBar();
    if(oldOrient!==posterOrientation){
      targets.phi=defaultPhi();
      current.phi=targets.phi;
      applyCamera();
    }
  }else fitCamera(true);
  dirty=true;
}

/* ---------- interaction ---------- */
function project(object){
  scene.updateMatrixWorld(true);
  const v=new THREE.Vector3().setFromMatrixPosition(object.matrixWorld).project(camera);
  return {x:(v.x*0.5+0.5)*wrap.clientWidth,y:(-v.y*0.5+0.5)*wrap.clientHeight};
}
function setHover(mesh,keepFocus){
  if(!keepFocus)focusIndex=-1;
  if(hoverCard===mesh)return;
  if(hoverCard&amp;&amp;hoverCard.userData.id!==selectedCard)hoverCard.scale.set(1,1,1);
  hoverCard=mesh;
  if(hoverCard){
    if(hoverCard.userData.id!==selectedCard)hoverCard.scale.set(1.05,1.05,1);
    tip.hidden=false;
    const id=hoverCard.userData.id;
    tip.textContent=&#x27;US&#x27;+id+&#x27; · &#x27;+NAMES[id-1]+&#x27; · &#x27;+POINTS[id-1]+&#x27; SP&#x27;;
    const p=project(hoverCard);
    tip.style.left=Math.round(p.x)+&#x27;px&#x27;;
    tip.style.top=Math.round(p.y)+&#x27;px&#x27;;
    canvas.classList.add(&#x27;kb-over-card&#x27;);
  }else{
    tip.hidden=true;
    canvas.classList.remove(&#x27;kb-over-card&#x27;);
  }
  dirty=true;
}
function refreshSelection(){
  for(const key in cardState){
    const st=cardState[key];
    const id=Number(key);
    const sel=id===selectedCard;
    st.selected=sel;
    if(st.mesh.userData.frame)st.mesh.userData.frame.visible=sel;
    st.mesh.scale.set(sel?1.06:1,sel?1.06:1,1);
    const old=st.mesh.material[4];
    const map=makeTexture(cardCanvas(cards[id-1].id,cards[id-1].name,cards[id-1].sp,st.accent,sel));
    st.mesh.material[4]=new THREE.MeshBasicMaterial({map:map});
    if(old){
      if(old.map&amp;&amp;old.map.dispose)old.map.dispose();
      if(old.dispose)old.dispose();
    }
  }
  updateDetail();
  dirty=true;
}
function selectCard(id,announce){
  if(!(id&gt;=1&amp;&amp;id&lt;=10))return;
  selectedCard=id;
  if(focusMode()&amp;&amp;cardState[id]&amp;&amp;cardState[id].lane!==activeLane){
    activeLane=cardState[id].lane;
    renderLaneBar();
  }
  refreshSelection();
  if(announce!==false)live.textContent=&#x27;Kartu US&#x27;+id+&#x27; &#x27;+NAMES[id-1]+&#x27; dipilih.&#x27;+NOTES[id];
  save();
}
function pickAt(clientX,clientY){
  if(!renderer||!camera)return null;
  scene.updateMatrixWorld(true);
  camera.updateMatrixWorld(true);
  const r=canvas.getBoundingClientRect();
  pointerNDC.x=((clientX-r.left)/r.width)*2-1;
  pointerNDC.y=-((clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointerNDC,camera);
  const hits=raycaster.intersectObjects(pickables,false);
  for(let i=0;i&lt;hits.length;i++){
    const o=hits[i].object;
    if(o&amp;&amp;o.userData&amp;&amp;o.userData.id)return o;
  }
  return null;
}
function onPointerDown(e){
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size&gt;=2){
    const pts=[...activePointers.values()];
    pointerDownInfo={mode:&#x27;pinch&#x27;,dist:Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)),zoom:targets.zoom};
  }else{
    pointerDownInfo={mode:&#x27;orbit&#x27;,x:e.clientX,y:e.clientY,theta:targets.theta,phi:targets.phi,moved:0};
  }
  canvas.classList.add(&#x27;kb-grabbing&#x27;);
}
function onPointerMove(e){
  if(activePointers.has(e.pointerId))activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!pointerDownInfo){
    setHover(pickAt(e.clientX,e.clientY),false);
    return;
  }
  if(pointerDownInfo.mode===&#x27;pinch&#x27;&amp;&amp;activePointers.size&gt;=2){
    const pts=[...activePointers.values()];
    const d=Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y));
    targets.zoom=Math.max(0.45,Math.min(2.6,pointerDownInfo.zoom*(pointerDownInfo.dist/d)));
    dirty=true;
    return;
  }
  const dx=e.clientX-pointerDownInfo.x;
  const dy=e.clientY-pointerDownInfo.y;
  pointerDownInfo.moved=Math.max(pointerDownInfo.moved,Math.abs(dx)+Math.abs(dy));
  if(focusMode()&amp;&amp;!pointerDownInfo.swiped&amp;&amp;Math.abs(dx)&gt;Math.abs(dy)*1.4){
    // one lane per gesture: horizontal swipe switches lane instead of orbiting
    const step=Math.max(40,wrap.clientWidth*0.16);
    if(dx&lt;-step){pointerDownInfo.swiped=true;setActiveLane(Math.min(3,activeLane+1));}
    else if(dx&gt;step){pointerDownInfo.swiped=true;setActiveLane(Math.max(0,activeLane-1));}
    dirty=true;
    return;
  }
  targets.theta=pointerDownInfo.theta-dx*0.0055;
  targets.phi=Math.max(0.14,Math.min(Math.PI/2-0.05,pointerDownInfo.phi-dy*0.005));
  dirty=true;
}
function onPointerUp(e){
  activePointers.delete(e.pointerId);
  if(pointerDownInfo&amp;&amp;pointerDownInfo.mode===&#x27;orbit&#x27;&amp;&amp;pointerDownInfo.moved&lt;6){
    const hit=pickAt(e.clientX,e.clientY);
    if(hit)selectCard(hit.userData.id);
  }
  if(activePointers.size===0)pointerDownInfo=null;
  else{
    const pts=[...activePointers.values()];
    pointerDownInfo={mode:&#x27;pinch&#x27;,dist:Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)),zoom:targets.zoom,moved:99};
  }
  canvas.classList.remove(&#x27;kb-grabbing&#x27;);
}
function onWheel(e){
  e.preventDefault();
  targets.zoom=Math.max(0.45,Math.min(2.6,targets.zoom*Math.exp(e.deltaY*0.0012)));
  dirty=true;
}
function onKeyDown(e){
  const ids=Object.keys(cardState).map(Number).sort((a,b)=&gt;a-b);
  if(e.key===&#x27;ArrowLeft&#x27;)targets.theta-=0.14;
  else if(e.key===&#x27;ArrowRight&#x27;)targets.theta+=0.14;
  else if(e.key===&#x27;ArrowUp&#x27;)targets.phi=Math.min(Math.PI/2-0.05,targets.phi+0.09);
  else if(e.key===&#x27;ArrowDown&#x27;)targets.phi=Math.max(0.14,targets.phi-0.09);
  else if(e.key===&#x27;+&#x27;||e.key===&#x27;=&#x27;)targets.zoom=Math.max(0.45,targets.zoom*0.9);
  else if(e.key===&#x27;-&#x27;||e.key===&#x27;_&#x27;)targets.zoom=Math.min(2.6,targets.zoom*1.1);
  else if(e.key===&#x27;Tab&#x27;){
    if(!ids.length)return;
    focusIndex=(focusIndex+1)%ids.length;
    const id=ids[focusIndex];
    setHover(cardState[id].mesh,true);
    live.textContent=&#x27;Kartu US&#x27;+id+&#x27; &#x27;+NAMES[id-1]+&#x27;. Tekan Enter untuk memilih.&#x27;;
    e.preventDefault();
    dirty=true;
    return;
  }
  else if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){
    if(!ids.length)return;
    const id=(focusIndex&gt;=0&amp;&amp;ids[focusIndex])?ids[focusIndex]:selectedCard;
    setHover(cardState[id].mesh,true);
    selectCard(id);
    e.preventDefault();
    return;
  }
  else return;
  e.preventDefault();
  dirty=true;
}
function syncElev(force){
  const deg=Math.round((Math.PI/2-current.phi)*180/Math.PI);
  const clamped=Math.max(4,Math.min(70,deg));
  if(force||clamped!==lastElevSync){
    lastElevSync=clamped;
    elevInput.value=String(clamped);
    elevValue.textContent=clamped+&#x27;°&#x27;;
  }
}

/* ---------- animation loop ---------- */
function tick(now){
  requestAnimationFrame(tick);
  const t=(now||performance.now())/1000;
  const dt=Math.min(0.05,Math.max(0.001,t-lastFrameTime));
  lastFrameTime=t;
  const damp=reduceMotion?1:Math.min(1,dt*9);
  let moving=false;

  if(spin&amp;&amp;!reduceMotion){
    targets.theta+=dt*0.25;
    moving=true;
  }
  for(const k of [&#x27;theta&#x27;,&#x27;phi&#x27;,&#x27;zoom&#x27;]){
    const d=targets[k]-current[k];
    if(Math.abs(d)&gt;0.0008){
      current[k]+=d*damp;
      moving=true;
    }else current[k]=targets[k];
  }
  applyCamera();
  syncElev(false);

  for(let i=0;i&lt;meshes.length;i++){
    const m=meshes[i];
    const sel=m.userData.id===selectedCard;
    let targetY=m.userData.targetY;
    if(!reduceMotion)targetY+=Math.sin(t*1.3+m.userData.id*0.7)*0.02;
    const targetZ=sel?0.62:0.3;
    const dy=targetY-m.position.y;
    const dz=targetZ-m.position.z;
    if(Math.abs(dy)&gt;0.0015||Math.abs(dz)&gt;0.0015){
      m.position.y+=dy*damp;
      m.position.z+=dz*damp;
      moving=true;
    }
    if(hoverCard===m&amp;&amp;!reduceMotion)m.rotation.y=Math.sin(t*2)*0.03;
    else if(m.rotation.y!==0)m.rotation.y+=(0-m.rotation.y)*damp;
    const f=m.userData.frame;
    if(f&amp;&amp;f.visible){
      f.position.y=m.position.y;
      f.position.z=m.position.z-0.07;
    }
  }
  if(!tip.hidden&amp;&amp;hoverCard){
    const p=project(hoverCard);
    tip.style.left=Math.round(p.x)+&#x27;px&#x27;;
    tip.style.top=Math.round(p.y)+&#x27;px&#x27;;
  }
  if(!moving){
    idleFrames++;
    if(idleFrames===1||idleFrames%60===0)renderer.render(scene,camera);
    else if(!dirty)return;
  }
  idleFrames=0;
  dirty=false;
  renderer.render(scene,camera);
}

/* ---------- scene setup ---------- */
function buildFloorAndGrid(){
  if(grid){scene.remove(grid);disposeObject(grid);}
  if(floor){scene.remove(floor);disposeObject(floor);}
  const y=-layoutMetrics().h/2-0.5;
  floor=new THREE.Mesh(
    new THREE.PlaneGeometry(80,80),
    new THREE.MeshStandardMaterial({color:rgb(PAL.bg),roughness:1,metalness:0,transparent:true,opacity:0.6})
  );
  floor.rotation.x=-Math.PI/2;
  floor.position.y=y;
  floor.receiveShadow=shadows;
  scene.add(floor);
  grid=new THREE.GridHelper(40,40,rgb(PAL.muted),rgb(PAL.border));
  grid.material.transparent=true;
  grid.material.opacity=0.2;
  grid.material.depthWrite=false;
  grid.position.y=y+0.004;
  scene.add(grid);
}
function applyLightColors(){
  if(rimLight)rimLight.color=rgb(PAL.lane[2]);
  if(fillLight)fillLight.color=rgb(PAL.lane[0]);
}
function initThree(T){
  three=T;
  window.THREE=T;
  renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true,powerPreference:&#x27;high-performance&#x27;});
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(52,1,0.1,300);
  shadows=window.innerWidth&gt;=620&amp;&amp;!window.matchMedia(&#x27;(pointer: coarse)&#x27;).matches;
  renderer.shadowMap.enabled=shadows;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  raycaster=new THREE.Raycaster();
  pointerNDC=new THREE.Vector2();

  scene.add(new THREE.HemisphereLight(0xffffff,0x505050,1.05));
  keyLight=new THREE.DirectionalLight(0xffffff,1.55);
  keyLight.position.set(6,11,9);
  if(shadows){
    keyLight.castShadow=true;
    keyLight.shadow.mapSize.width=1024;
    keyLight.shadow.mapSize.height=1024;
    keyLight.shadow.camera.near=1;
    keyLight.shadow.camera.far=60;
    keyLight.shadow.camera.left=-16;
    keyLight.shadow.camera.right=16;
    keyLight.shadow.camera.top=16;
    keyLight.shadow.camera.bottom=-16;
    keyLight.shadow.bias=-0.0017;
  }
  scene.add(keyLight);
  rimLight=new THREE.DirectionalLight(rgb(PAL.lane[2]),0.6);
  rimLight.position.set(-9,6,-8);
  scene.add(rimLight);
  fillLight=new THREE.PointLight(rgb(PAL.lane[0]),30,30,2);
  fillLight.position.set(0,4.5,7);
  scene.add(fillLight);

  targets.phi=current.phi=defaultPhi();
  targets.theta=current.theta=-0.24;
  targets.zoom=current.zoom=1;
  syncElev(true);

  broadLayout=document.documentElement.clientWidth&lt;620;
  setScale();
  posterOrientation=isPortrait()?&#x27;portrait&#x27;:&#x27;landscape&#x27;;
  buildFloorAndGrid();
  buildBoard();
  resize();
  refreshSelection();
  renderLaneBar();

  canvas.addEventListener(&#x27;pointerdown&#x27;,onPointerDown);
  canvas.addEventListener(&#x27;pointermove&#x27;,onPointerMove);
  canvas.addEventListener(&#x27;pointerup&#x27;,onPointerUp);
  canvas.addEventListener(&#x27;pointercancel&#x27;,onPointerUp);
  canvas.addEventListener(&#x27;pointerleave&#x27;,()=&gt;setHover(null,false));
  canvas.addEventListener(&#x27;wheel&#x27;,onWheel,{passive:false});
  canvas.addEventListener(&#x27;keydown&#x27;,onKeyDown);
  canvas.addEventListener(&#x27;webglcontextlost&#x27;,ev=&gt;{
    ev.preventDefault();
    contextLost=true;
    fail(&#x27;Konteks WebGL hilang. Papan ditampilkan dalam mode 2D.&#x27;);
  });
  window.addEventListener(&#x27;resize&#x27;,resize);
  if(window.ResizeObserver)new ResizeObserver(()=&gt;resize()).observe(wrap);
  loading.hidden=true;
  dirty=true;
  requestAnimationFrame(tick);
}

/* ---------- DOM fallback ---------- */
let fallbackRendered=false;
function renderFallback(){
  fallbackRendered=true;
  const cols=laneColumns(phase);
  fallback.replaceChildren();
  LANE_TITLES.forEach((title,i)=&gt;{
    const lane=document.createElement(&#x27;section&#x27;);
    lane.className=&#x27;kb-lane&#x27;;
    const h=document.createElement(&#x27;h3&#x27;);
    h.textContent=title+&#x27; · &#x27;+cols[i].length;
    lane.append(h);
    const cap=document.createElement(&#x27;div&#x27;);
    cap.className=&#x27;text-small text-muted&#x27;;
    cap.textContent=LANE_NOTES[i];
    lane.append(cap);
    const list=document.createElement(&#x27;div&#x27;);
    list.className=&#x27;kb-cards&#x27;;
    cols[i].forEach(id=&gt;{
      const b=document.createElement(&#x27;button&#x27;);
      b.type=&#x27;button&#x27;;
      b.className=&#x27;btn kb-ticket&#x27;+(id===selectedCard?&#x27; btn-primary&#x27;:&#x27;&#x27;);
      b.setAttribute(&#x27;aria-pressed&#x27;,String(id===selectedCard));
      const a=document.createElement(&#x27;span&#x27;);
      a.className=&#x27;kb-id&#x27;;
      a.textContent=&#x27;US&#x27;+id;
      const n=document.createElement(&#x27;span&#x27;);
      n.textContent=NAMES[id-1];
      const sp=document.createElement(&#x27;span&#x27;);
      sp.className=&#x27;text-small&#x27;;
      sp.textContent=POINTS[id-1]+&#x27; SP&#x27;;
      b.append(a,n,sp);
      b.addEventListener(&#x27;click&#x27;,()=&gt;{
        selectedCard=id;
        fallbackRendered=false;
        renderFallback();
        updateDetail();
        save();
      });
      list.append(b);
    });
    if(!cols[i].length){
      const e=document.createElement(&#x27;div&#x27;);
      e.className=&#x27;kb-empty text-small&#x27;;
      e.textContent=&#x27;Tidak ada kartu&#x27;;
      list.append(e);
    }
    lane.append(list);
    fallback.append(lane);
  });
}
function fail(message){
  loading.hidden=true;
  tip.hidden=true;
  wrap.hidden=true;
  fallback.hidden=false;
  resetBtn.disabled=true;
  spinBtn.disabled=true;
  if(!document.getElementById(&#x27;kb-fallback-note&#x27;)){
    const note=document.createElement(&#x27;div&#x27;);
    note.id=&#x27;kb-fallback-note&#x27;;
    note.className=&#x27;text-small text-muted&#x27;;
    note.style.marginTop=&#x27;8px&#x27;;
    note.textContent=message;
    fallback.after(note);
  }
  renderFallback();
}

/* ---------- phone lane focus ---------- */
function focusMode(){
  return !!(three&amp;&amp;scene&amp;&amp;!contextLost&amp;&amp;broadLayout);
}
function renderLaneBar(){
  const on=focusMode();
  laneBar.hidden=!on;
  if(!on){laneBar.replaceChildren();return;}
  const cols=laneColumns(phase);
  laneBar.replaceChildren(...LANE_TITLES.map((title,i)=&gt;{
    const b=document.createElement(&#x27;button&#x27;);
    b.type=&#x27;button&#x27;;
    b.className=&#x27;btn&#x27;+(i===activeLane?&#x27; btn-primary&#x27;:&#x27;&#x27;);
    b.setAttribute(&#x27;role&#x27;,&#x27;tab&#x27;);
    b.setAttribute(&#x27;aria-selected&#x27;,String(i===activeLane));
    b.textContent=title+&#x27; (&#x27;+cols[i].length+&#x27;)&#x27;;
    b.addEventListener(&#x27;click&#x27;,()=&gt;{
      activeLane=i;
      if(three&amp;&amp;renderer&amp;&amp;!contextLost){buildBoard();refreshSelection();}
      renderLaneBar();
      live.textContent=&#x27;Kolom &#x27;+title+&#x27;, &#x27;+cols[i].length+&#x27; kartu.&#x27;;
      save();
      dirty=true;
    });
    return b;
  }));
}
function setActiveLane(i){
  if(i&lt;0||i&gt;3||i===activeLane)return;
  activeLane=i;
  if(three&amp;&amp;renderer&amp;&amp;!contextLost){buildBoard();refreshSelection();}
  renderLaneBar();
  dirty=true;
}

/* ---------- UI wiring ---------- */
phaseSel.addEventListener(&#x27;change&#x27;,()=&gt;{
  phase=Number(phaseSel.value)||0;
  if(three&amp;&amp;renderer&amp;&amp;!contextLost){
    buildBoard();
    refreshSelection();
    renderLaneBar();
  }else{
    fallbackRendered=false;
    renderFallback();
    updateDetail();
  }
  dirty=true;
  save();
});
elevInput.addEventListener(&#x27;input&#x27;,()=&gt;{
  elevValue.textContent=elevInput.value+&#x27;°&#x27;;
  targets.phi=(Math.PI/2)-(Number(elevInput.value)*Math.PI/180);
  lastElevSync=Number(elevInput.value);
  dirty=true;
});
elevInput.addEventListener(&#x27;change&#x27;,save);
resetBtn.addEventListener(&#x27;click&#x27;,()=&gt;{
  targets.theta=-0.24;
  targets.phi=defaultPhi();
  lastElevSync=Number(elevInput.value);
  targets.zoom=1;
  dirty=true;
});
spinBtn.addEventListener(&#x27;click&#x27;,()=&gt;{
  spin=!spin;
  spinBtn.setAttribute(&#x27;aria-pressed&#x27;,String(spin));
  dirty=true;
});
function reTheme(){
  PAL=palette();
  colorCache.clear();
  if(three&amp;&amp;renderer&amp;&amp;scene&amp;&amp;!contextLost){
    applyLightColors();
    buildFloorAndGrid();
    buildBoard();
    refreshSelection();
  }else{
    fallbackRendered=false;
    renderFallback();
  }
  dirty=true;
}
(function watchTheme(){
  if(window.MutationObserver){
    let queued=false;
    new MutationObserver(()=&gt;{
      if(queued)return;
      queued=true;
      setTimeout(()=&gt;{queued=false;reTheme();},100);
    }).observe(document.documentElement,{attributes:true,attributeFilter:[&#x27;data-theme&#x27;,&#x27;class&#x27;,&#x27;style&#x27;]});
  }

  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",

      state == null ||
      typeof state !== "object" ||

        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))

    const data = event.data;

})();
